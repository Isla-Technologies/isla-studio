name: Isla Studio

on:
  push:
  pull_request:

jobs:
  rust:
    name: Native Rust on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install stable Rust
        run: rustup update stable
      # The wheel supplies the pinned native shared library. Rust tests do not run Python.
      - name: Provision native MuJoCo
        run: |
          python -m pip install mujoco==3.15.0
          python -c "import os,pathlib,mujoco; root=pathlib.Path(mujoco.__file__).parent; files=[p for p in root.iterdir() if p.name=='mujoco.dll' or p.name.startswith('libmujoco.so') or p.name.startswith('libmujoco.') and p.suffix=='.dylib']; assert len(files)==1, files; pathlib.Path(os.environ['GITHUB_ENV']).open('a').write('ISLA_MUJOCO_LIBRARY='+str(files[0])+'\n')"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Native tests
        run: cargo test --workspace --locked

  python:
    name: Tests on ${{ matrix.os }}, Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check isla_rl tests
      - name: Test
        run: python -m pytest -q

  ui:
    name: Interface builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vite build
