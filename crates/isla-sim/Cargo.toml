[package]
name = "isla-sim"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native MuJoCo integration and robot models for Isla Studio"
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
libloading = "0.8"
nalgebra = "0.34"
tempfile = "3"
sha2 = "0.10"
