[package]
name = "isla-hardware"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native motor protocols, safety, transports and robot relay for Isla Studio"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4.8", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
isla-sim = { path = "../isla-sim" }
isla-learn = { path = "../isla-learn" }
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
socketcan = "3.5"

[dev-dependencies]
tempfile = "3"
