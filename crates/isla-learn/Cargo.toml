[package]
name = "isla-learn"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native policy execution and reinforcement learning for Isla Studio"

[dependencies]
anyhow = "1"
base64 = "0.22"
ndarray = "0.16"
ndarray-npy = "0.9"
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
