<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050505" />
    <meta name="color-scheme" content="dark light" />
    <title>Isla Studio</title>
    <script>
      // The theme before the first paint (src/lib/theme.ts keeps it after): the choice made, else the system's.
      (function () {
        var theme = 'dark';
        try {
          var chosen = localStorage.getItem('isla-theme');
          theme = chosen === 'light' || chosen === 'dark' ? chosen : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        } catch (error) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
