[project]
name = "isla-studio"
version = "0.1.0"
description = "Teach your legged robot to stand, walk and jump from your own computer: reinforcement learning in MuJoCo, hardware co-design, and running the result on the real robot."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Isla Technologies" }]
keywords = ["robotics", "reinforcement-learning", "mujoco", "humanoid", "legged-robots", "sim-to-real", "urdf", "ppo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mujoco==3.15.0",
    "numpy>=1.26,<3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    "python-can>=4.3",
    "pyserial>=3.5",
]

[project.optional-dependencies]
gpu = ["warp-lang==1.18.0", "mujoco-warp==3.15.0", "cupy-cuda12x[ctk]>=13.3"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/Isla-Technologies/isla-studio"
Documentation = "https://github.com/Isla-Technologies/isla-studio/tree/main/docs"
Issues = "https://github.com/Isla-Technologies/isla-studio/issues"

[project.scripts]
# Works from a checkout installed with `pip install -e .`: robots, runs and the interface live beside the code.
isla-studio = "isla_rl.server.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["isla_rl*"]

[tool.ruff]
line-length = 160
target-version = "py310"
extend-exclude = [".scratch", "ui"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx`"]
