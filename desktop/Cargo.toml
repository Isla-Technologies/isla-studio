[package]
name = "isla-studio"
version = "0.1.0"
description = "Isla Studio desktop"
authors = ["Isla Technologies"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"

[features]
custom-protocol = ["tauri/custom-protocol"]
